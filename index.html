<!doctype html>
<!--
  ALUZ — Streetwear da Rua (index.html)

  Página única (SPA simples) da loja ALUZ, com carrinho de compras. Este arquivo define apenas a ESTRUTURA do site;
  a aparência fica em styles.css e o comportamento (navegação, catálogo, WhatsApp, intro) em script.js.

  Main functionality:
   - Intro animada de abertura (#intro), exibida uma vez por sessão
   - Barra lateral com logo, campo de busca e navegação entre as seções
   - Em telas até 900px a barra lateral vira uma barra no topo, com botão hambúrguer (.menu-toggle) que abre o menu (#sidebar-menu)
   - Cinco views alternadas por script.js: "Quem Somos", "Produtos", "Carrinho", "Ensaio de Fotos" e "Informações"
   - Carrinho (#cart-view): itens, tamanhos, quantidades, cálculo de frete por CEP e resumo montados por script.js em #cart-content; ao finalizar abre uma tela com os dados do cliente (nome, CPF, endereço, telefone) e o pedido segue para o WhatsApp
   - Contatos (#sidebar-contact) e conteúdo de "Informações" (#info-content) são montados por script.js a partir de SITE_INFO
   - Contêineres vazios (#product-grid e #product-detail) preenchidos dinamicamente com os produtos

  Arquivos relacionados:
   - styles.css  -> estilos (tema preto e branco, estética punk/skate)
   - script.js   -> dados dos produtos e interatividade
   - fotos/      -> logotipos, fotos de produtos e do ensaio
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Largura responsiva para celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALUZ — Streetwear da Rua</title>
    <!-- Descrição exibida em resultados de busca (SEO) -->
    <meta
      name="description"
      content="ALUZ — streetwear underground inspirado na energia das ruas."
    />
    <!-- Cor da barra do navegador no celular -->
    <meta name="theme-color" content="#080808" />
    <!-- Ícone da aba do navegador (favicon.svg: um "A" branco sobre fundo preto) -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Prévia ao compartilhar o link (WhatsApp, Instagram, Telegram...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ALUZ" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="ALUZ — Streetwear da Rua" />
    <meta property="og:description" content="ALUZ — streetwear underground inspirado na energia das ruas." />
    <!-- QUANDO O SITE TIVER ENDEREÇO (domínio): descomente as linhas abaixo e troque pelas URLs completas.
         O og:image precisa ser um endereço absoluto (https://...) de uma imagem de uns 1200x630 px; sem ele, a prévia mostra só título e texto. -->
    <!-- <meta property="og:url" content="https://SEU-DOMINIO.com.br/" /> -->
    <!-- <meta property="og:image" content="https://SEU-DOMINIO.com.br/fotos/og-aluz.jpg" /> -->
    <!-- <meta name="twitter:card" content="summary_large_image" /> -->
    <!-- Folha de estilos; o "?v=20" é um número de versão para forçar o navegador a recarregar o CSS após mudanças -->
    <link rel="stylesheet" href="styles.css?v=22" />
  </head>
  <body>
    <!-- ================================= INTRO: animação de abertura ================================= -->
    <!-- Camadas animadas pelo CSS: brilho (glow) -> clarão (flash) -> logo. Escondida de leitores de tela (aria-hidden) -->
    <div id="intro" aria-hidden="true">
      <div class="intro-glow"></div>
      <div class="intro-flash"></div>
      <img class="intro-logo" src="fotos/Logotipo_ALUZ_preta.png" alt="" />
      <span class="intro-skip">clique para pular</span>
    </div>
    <!-- Script inline executado imediatamente: precisa rodar antes da primeira pintura para a intro não "piscar" em quem já a viu -->
    <script>
      // já viu a intro nesta sessão? então some na hora
      try {
        if (sessionStorage.getItem("aluzIntro")) document.getElementById("intro").remove();
      } catch (e) {}
    </script>

    <!-- ================================= APP SHELL: barra lateral + área principal ================================= -->
    <div class="app-shell">
      <!-- ---------------------------- Barra lateral (navegação) ---------------------------- -->
      <aside class="sidebar" aria-label="Navegação lateral">
        <!-- Logo da marca: ao clicar, script.js volta para "Quem Somos" -->
        <div class="brand-row">
          <button class="brand" type="button" aria-label="Ir para o início">
            <img class="brand-logo" src="fotos/Logotipo_ALUZ.png" alt="ALUZ" />
          </button>
          <!-- Botão hambúrguer: só aparece em telas até 900px (ver CSS). script.js liga/desliga a classe "menu-open" na sidebar -->
          <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar-menu">
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
          </button>
        </div>

        <!-- Menu (busca + seções). No desktop o wrapper é invisível (display: contents); no celular vira o painel que abre sob a barra do topo -->
        <div class="sidebar-menu" id="sidebar-menu">

        <!-- Campo de busca: o input fica invisível até receber foco (ver .search-row no CSS) e filtra os produtos -->
        <label class="search-row" for="search">
          <span>Pesquisar</span>
          <input id="search" type="search" aria-label="Pesquisar" />
          <!-- Ícone de lupa (SVG inline) -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
        </label>

        <!-- Botões de seção: o atributo data-view é lido por script.js (showView) para decidir qual view mostrar -->
        <nav class="sidebar-sections" aria-label="Seções da ALUZ">
         <button class="side-section-button active" type="button" data-view="quem-somos">Quem Somos</button>

          <button class="side-section-button" type="button" data-view="pronto-entrega">Produtos</button>

          <!-- Carrinho: o contador (#cart-badge) é atualizado por script.js e some quando o carrinho está vazio -->
          <button class="side-section-button" type="button" data-view="carrinho">Carrinho<span class="cart-badge" id="cart-badge" hidden>0</span></button>

          <button class="side-section-button" type="button" data-view="ensaio-fotos">Ensaio de Fotos</button>

          <button class="side-section-button" type="button" data-view="informacoes">Informações</button>

        </nav>

        <!-- Contato fixo (WhatsApp e, se configurado, Instagram): preenchido por renderStoreInfo() em script.js -->
        <div class="sidebar-contact" id="sidebar-contact"></div>
        </div>

      </aside>

      <!-- ---------------------------- Área principal (views) ---------------------------- -->
      <main class="main-area">
        <!-- VIEW 1 — Quem Somos: apresentação da marca (visível ao abrir o site) -->
        <section class="about-view" id="about-view" aria-label="Quem Somos">
          <div class="about-copy">
            <p class="eyebrow">ALUZ / STREETWEAR UNDERGROUND</p>
            <img class="about-logo" src="fotos/Logotipo_ALUZ.png" alt="Logo ALUZ" />
            <p class="about-lede">
              ALUZ transforma códigos da rua em peças autorais. Criada para quem vive
              fora do padrão e encontra identidade no underground.
            </p>
            <div class="about-footer">
              <span>100% BRASIL</span>
              <span>Malandragem ainda vive</span>
            </div>
          </div>
        </section>

        <!-- VIEW 2 — Produtos (catálogo): começa oculta (hidden) e é mostrada por script.js -->
        <section class="catalog" id="catalog-view" aria-labelledby="catalog-title" hidden>
          <!-- Cabeçalho do catálogo: título em imagem + contador de peças (#product-count é atualizado por renderProducts) -->
          <div class="catalog-heading">
            <div>
              <h1 id="catalog-title"><img class="catalog-title-image" src="fotos/PRODUTOS.png" alt="Produtos" /></h1>
            </div>
            <p class="catalog-count"><span id="product-count">0</span> PEÇAS</p>
          </div>

            <!-- Detalhe do produto / tela de medidas: preenchido por openProductDetail() e openMeasures() -->
            <div class="product-detail" id="product-detail" hidden aria-live="polite"></div>
          <!-- Lista de produtos: preenchida por renderProducts(); aria-live avisa leitores de tela quando a busca muda a lista -->
          <div class="product-grid" id="product-grid" aria-live="polite"></div>
        </section>

        <!-- VIEW 3 — Carrinho: reaproveita o visual de "Informações"; o conteúdo é desenhado por renderCart() em script.js -->
        <section class="info-view cart-view" id="cart-view" aria-labelledby="cart-title" hidden>
          <div class="info-heading">
            <h1 id="cart-title">Carrinho</h1>
          </div>
          <div class="cart-content" id="cart-content" aria-live="polite"></div>
        </section>

        <!-- VIEW 4 — Ensaio de Fotos: galeria estática de 4 fotos, também oculta até ser selecionada -->
        <section class="photoshoot-view" id="photoshoot-view" aria-labelledby="photoshoot-title" hidden>
          <div class="photoshoot-heading">
            <h1 id="photoshoot-title"><img class="photoshoot-title-image" src="fotos/Ensaio de Fotos.png" alt="Ensaio de fotos" /></h1>
          </div>
          <!-- Cada foto é um <figure> com legenda numerada (01 a 04) -->
          <div class="photoshoot-gallery" aria-label="Galeria do ensaio">
            <figure class="photoshoot-item">
              <img src="fotos/ensaio ft 1.png" alt="Ensaio de fotos ALUZ 1" />
              <figcaption>01</figcaption>
            </figure>
            <figure class="photoshoot-item">
              <img src="fotos/ensaio ft 2.png" alt="Ensaio de fotos ALUZ 2" />
              <figcaption>02</figcaption>
            </figure>
            <figure class="photoshoot-item">
              <img src="fotos/ensaio ft 3.png" alt="Ensaio de fotos ALUZ 3" />
              <figcaption>03</figcaption>
            </figure>
            <figure class="photoshoot-item">
              <img src="fotos/ensaio foto 4.png" alt="Ensaio de fotos ALUZ 4" />
              <figcaption>04</figcaption>
            </figure>
          </div>
        </section>

        <!-- VIEW 5 — Informações: como comprar, pagamento, envio e trocas (conteúdo vem de SITE_INFO em script.js) -->
        <section class="info-view" id="info-view" aria-labelledby="info-title" hidden>
          <div class="info-heading">
            <h1 id="info-title">Informações</h1>
          </div>
          <div class="info-content" id="info-content"></div>
        </section>
      </main>
    </div>

    <!-- Lógica do site; carregado no fim do body para que todos os elementos acima já existam. "?v=16" = versão para limpar o cache -->
    <script src="script.js?v=18"></script>
  </body>
</html>
